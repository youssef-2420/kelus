name: Deploy Kelus to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kelus-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production deployment configuration
        run: node scripts/validate-cloudflare-env.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - run: node scripts/prepare-cloudflare-deploy.mjs
        env:
          CLOUDFLARE_D1_DATABASE_NAME: kelus-production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply kelus-production --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production Worker
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Warm production product snapshots
        run: npm run snapshots:warm:production
        env:
          KELUS_BASE_URL: https://kelus.me
          SNAPSHOT_WARM_CONCURRENCY: "1"
          SNAPSHOT_WARM_DELAY_MS: "2000"
          # Deployment is a provider-health smoke test, not a second catalog crawler.
          # Scheduled rotation maintains the complete catalog within its API budget.
          SNAPSHOT_WARM_LIMIT: "3"
