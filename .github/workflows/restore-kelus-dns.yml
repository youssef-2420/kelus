name: Restore kelus.me DNS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-kelus-dns.yml"

permissions:
  contents: read

jobs:
  restore-dns:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Point kelus.me at GitHub Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi

          api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$@"
          }

          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=kelus.me")
          ZONE_ID=$(echo "$ZONE" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "Could not find Cloudflare zone for kelus.me"
            echo "$ZONE" | jq .
            exit 1
          fi
          echo "Zone $ZONE_ID"

          RECORDS=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100")
          echo "$RECORDS" | jq -r '.result[] | "\(.type) \(.name) \(.content) proxied=\(.proxied) \(.id)"'

          delete_web_records() {
            echo "$RECORDS" | jq -c '.result[] | select((.name=="kelus.me" or .name=="www.kelus.me") and (.type=="A" or .type=="AAAA" or .type=="CNAME"))' | while read -r row; do
              id=$(echo "$row" | jq -r '.id')
              echo "Deleting $(echo "$row" | jq -r '"\(.type) \(.name) \(.content)"')"
              api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id" >/dev/null
            done
          }
          delete_web_records

          create() {
            local payload=$1
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" --data "$payload" | jq -r '"created \(.result.type) \(.result.name) \(.result.content)"'
          }

          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            create "{\"type\":\"A\",\"name\":\"kelus.me\",\"content\":\"$ip\",\"ttl\":300,\"proxied\":false}"
          done
          for ip in 2606:50c0:8000::153 2606:50c0:8001::153 2606:50c0:8002::153 2606:50c0:8003::153; do
            create "{\"type\":\"AAAA\",\"name\":\"kelus.me\",\"content\":\"$ip\",\"ttl\":300,\"proxied\":false}"
          done
          create '{"type":"CNAME","name":"www","content":"youssef-2420.github.io","ttl":300,"proxied":false}'

          echo "Restored GitHub Pages records. Email MX/TXT left unchanged."
